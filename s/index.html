<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Seed Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Mycelial Minimalism, same as One Button: white paper, ink, spark accent, hairlines, square corners. */
  :root{--paper:#FFFFFF;--surface:#F5F5F5;--ink:#1A1A1A;--muted:#555555;--line:rgba(26,26,26,.15);--spark:#E6FF00}
  *{box-sizing:border-box}
  [hidden],.hidden{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Inter",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
  .bar{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 8px;position:sticky;top:0;z-index:20;background:var(--paper,var(--cream,#FFFFFF))}
  .mark{font:700 18px "Inter Tight",sans-serif;letter-spacing:-.01em}
  .mark b{box-shadow:inset 0 -6px 0 var(--spark)}
  .tag{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  h1{font:800 34px/1.1 "Inter Tight",sans-serif;letter-spacing:-.02em;margin:12px 0 6px}
  h2{font:700 20px "Inter Tight",sans-serif;margin:40px 0 4px;letter-spacing:-.01em}
  h3{font:700 17px "Inter Tight",sans-serif;margin:4px 0 6px}
  .lede{color:var(--muted);margin:0 0 10px;font-size:15px}
  .box{border:1px solid var(--line);padding:14px 16px;margin:12px 0}
  .q{font-size:14px;border-left:2px solid var(--spark);padding:2px 0 2px 12px;margin-top:6px;font-style:italic;color:var(--muted)}
  .note{font-size:15px;border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  button,a.btn{font:600 14px "Inter",sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:10px 14px;min-height:44px;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;text-decoration:none}
  button:hover{background:var(--surface)}
  button.on{background:var(--ink);color:var(--paper)}
  button.link::before,a.link::before,.link::before{content:none!important;display:none!important}
  .link{background:none;border:0;padding:0;min-height:0;text-decoration:underline;color:var(--muted);font-weight:500}
  input,textarea,select{font:16px "Inter",sans-serif;padding:10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;margin:4px 0 8px}
  textarea{min-height:80px}
  .me{background:var(--spark);padding:10px 12px;font-size:14px;margin:12px 0}
  #map{width:100%;height:auto;border:1px solid var(--line);margin-top:8px}
  #map text{font:500 11px "Inter",sans-serif;fill:var(--ink)}
  .foot{margin-top:36px;color:var(--muted);font-size:14px}
  a{color:var(--ink)}
</style>
<script src="/skins/skin.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar"><span class="mark">One <b>Button</b></span><span class="tag" id="mode">Seed space</span></div>
  <div id="body"><p class="lede">Opening.</p></div>
</div>
<script>
/* A seed space: an open commons around one topic. Anyone can read it. Members (anyone admitted
   by someone already in) add notes, link their own conversations and take in seeds offered from
   private spaces. Names show only for members who opt in. Content is CC BY-SA 4.0. */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API=(/^(one-button-jay\.web\.app|localhost|127\.0\.0\.1)$/.test(location.hostname)||/--/.test(location.hostname)?'':'https://one-button-jay.web.app')+'/api/ss/';
const CANOPY='https://canopy-website-ef7a8.web.app',WEAVE=CANOPY+'/api/weave-trust';
const Q=new URLSearchParams(location.search),SLUG=Q.get('s')||'',INVITE=Q.get('invite');
let PREVIEW=false; // a member's look at the public page, with seeds still waiting for a yes shown as they would appear
const COM='ss-'+SLUG;
function appKey(){try{if(window.OBNative&&OBNative.apiKey)return OBNative.apiKey();}catch(e){}
  try{if(window.parent!==window&&window.parent.obKey)return window.parent.obKey();}catch(e){}try{return JSON.parse(localStorage.getItem('ob-key')||'""');}catch(e){return '';}}
const KEY=appKey();let W=null;
const tok=()=>W&&W.token?W.token():'';
const post=(route,body={})=>{if(tok())body.token=tok();return fetch(API+route,{method:'POST',headers:{'Content-Type':'application/json',...(KEY?{'x-ob-key':KEY}:{})},body:JSON.stringify(body)})
  .then(r=>r.json().then(d=>r.ok?d:Promise.reject(new Error(d.error||r.status))));};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const say=t=>{const e=$('#say');if(e){e.textContent=t;e.hidden=!t;}};
const shareOut=(url,title)=>{const u=encodeURIComponent(url),t=encodeURIComponent(title+' '),both=encodeURIComponent(title+' '+url);
  return `<div class="row"><span class="tag">Share out</span><a class="btn" href="https://t.me/share/url?url=${u}&text=${t}" target="_blank" rel="noopener">Telegram</a><a class="btn" href="https://wa.me/?text=${both}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener">Facebook</a><a class="btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${u}" target="_blank" rel="noopener">LinkedIn</a>${navigator.share?`<button data-native="${esc(url)}" data-title="${esc(title)}">More, including Instagram</button>`:''}</div>`;};
document.addEventListener('click',e=>{const b=e.target.closest('[data-native]');if(!b)return;navigator.share({title:b.dataset.title,text:b.dataset.title,url:b.dataset.native}).catch(()=>{});});

function render(d){
  let M=!!d.me,url=location.origin+location.pathname+'?s='+encodeURIComponent(SLUG);
  $('#mode').textContent=M?'Seed space, member':'Seed space';
  const notesFor=id=>d.notes.filter(n=>n.seed===id);
  const seed=s=>`<div class="box" id="seed-${esc(s.id)}"${s.status==='preview'?' style="border-style:dashed"':''}><span class="tag">${esc(s.kind)} . ${esc(s.when)} . from ${s.status==='preview'?'a member':esc((s.from||[]).join(' and '))}${s.status==='offered'?' . offered, waiting for a member to take it in':''}${s.status==='preview'?' . preview: shows here once everyone in its conversation says yes':''}</span><h3>${esc(s.title)}</h3><div>${esc(s.about)}</div>
    ${s.quote?`<div class="q">${s.at?'At '+mmss(s.at)+': ':''}"${esc(s.quote)}"</div>`:''}
    ${notesFor(s.id).map(n=>`<div class="note">${esc(n.text)} <span class="tag">${esc(n.by)}</span></div>`).join('')}
    ${M?`<div class="row">${s.status==='offered'?`<button data-accept="${esc(s.id)}">Take it in</button>`:''}<button class="link" data-addnote="${esc(s.id)}">Add to this seed</button></div><div id="nf-${esc(s.id)}"></div>`:''}</div>`;
  const waitingAsPublic=(d.mine||[]).map(s=>({...s,from:['you'],status:'preview'}));
  const pub=d.seeds.filter(s=>s.status==='public').concat(PREVIEW?waitingAsPublic:[]),off=d.seeds.filter(s=>s.status==='offered');
  const M0=M;if(PREVIEW)M=false;
  $('#body').innerHTML=`<h1>${esc(d.name)}</h1><p class="lede">${esc(d.about||'')}</p>
    ${d.grewFrom?`<p class="tag" style="text-transform:none;letter-spacing:0;font-size:14px">${M&&Array.isArray(d.grewFrom)?'Grew from the conversations of '+esc(d.grewFrom.join(' and ')):'Grew from a conversation between '+(Array.isArray(d.grewFrom)?d.grewFrom.length:d.grewFrom)+' people'}. They are its first members.</p>`:''}
    <p class="tag">${d.members} member${d.members===1?'':'s'}${d.named.length?' . including '+esc(d.named.join(', ')):''} . ${pub.length} seed${pub.length===1?'':'s'} . ${d.links.length} linked conversation${d.links.length===1?'':'s'}</p>
    ${M?`<div class="me">You are a member. ${d.me.show?'Your name shows on what you add.':'You are anonymous here: what you add shows as "a member".'} <button class="link" id="optin">${d.me.show?'Go anonymous':'Show my name'}</button></div>`:''}
    <p id="say" class="me" hidden></p>
    ${M&&d.parent?`<h2>Listen</h2><p class="lede">The podcast of this subspace: a short introduction, then the moments from your conversations. Only members hear it.</p><iframe title="Podcast" src="/space.html?s=${encodeURIComponent(d.parent)}&topic=${encodeURIComponent(SLUG)}&pod=1" style="width:100%;height:470px;border:0;background:transparent" allow="autoplay; microphone"></iframe>`:''}
    ${M0?`<div class="row"><button id="pv" class="${PREVIEW?'on':''}">${PREVIEW?'Back to my view':'Preview the public page'}</button><span class="tag">${PREVIEW?'This is what anyone with the link will see, with your waiting seeds shown dashed as if agreed.':'See it as the public will, including seeds still waiting for a yes.'}</span></div>`:''}
    ${M&&(d.mine||[]).length?`<h2>From your conversations</h2><p class="lede">Seeds from conversations you were in that fit this space. Only the people in each conversation see these here. Each comes in when everyone in its conversation has said yes.</p>
      ${d.mine.map(s=>`<div class="box"><span class="tag">${esc(s.kind)} . from "${esc(s.convTitle||'')}" . ${s.waiting.length?'waiting for '+esc(s.waiting.join(', '))+' to say yes':'everyone said yes'}${s.intended?' . set to come here':''}</span><h3>${esc(s.title)}</h3><div>${esc(s.about)}</div>${s.quote?`<div class="q">${s.at?'At '+mmss(s.at)+': ':''}"${esc(s.quote)}"</div>`:''}
        <div class="row">${s.waiting.length?(s.intended?'<span class="tag">It arrives here by itself on the last yes.</span>':`<button data-bring="${esc(s.id)}">Bring it here when everyone says yes</button>`):`<button data-bring="${esc(s.id)}">Put it in now</button>`}<a class="link" href="/space.html?s=${esc(s.origin)}" target="_blank" rel="noopener">Open its conversation space</a></div></div>`).join('')}`:''}
    <h2>How it connects</h2><p class="lede">Seeds, the conversations they came from, and the conversations people have linked in.</p><svg id="map" role="img" aria-label="Map of seeds and conversations"></svg>
    <h2>Seeds</h2>${pub.length?pub.map(seed).join(''):'<p class="lede">No seeds yet.</p>'}
    ${M&&off.length?`<h2>Offered, waiting for a member</h2>${off.map(seed).join('')}`:''}
    <h2>Conversations linked in</h2><p class="lede">Parallel conversations on the same topic. Their words stay with the people who had them; only a title and a line or two come here.</p>
    ${d.links.length?d.links.map(l=>`<div class="box"><b>${esc(l.title)}</b> <span class="tag">${esc(l.by)}</span><div style="font-size:15px;color:var(--muted)">${esc(l.summary)}</div></div>`).join(''):'<p class="lede">None yet.</p>'}
    ${M?`<div class="box"><b>Link one of your conversations</b><p class="lede" style="margin:4px 0 8px">Pick one from your conversations: the likeliest fits come first. Only its title and a line or two come here, and you can change those before linking.</p>
      <input id="lk-find" placeholder="Search your conversations" aria-label="Search your conversations"><div id="lk-list"><p class="tag">${KEY?'Loading your conversations…':'Open this from the One Button app to browse your conversations, or type one below.'}</p></div>
      <input id="lk-t" placeholder="Its title"><textarea id="lk-s" placeholder="A line or two on what it adds here"></textarea><button id="lk-go">Link it</button></div>`:''}
    <h2>Notes</h2>${d.notes.filter(n=>!n.seed).map(n=>`<div class="note">${esc(n.text)} <span class="tag">${esc(n.by)}</span></div>`).join('')||'<p class="lede">None yet.</p>'}
    ${M?`<div class="box"><textarea id="nt" placeholder="Add a note for everyone here"></textarea><button id="nt-go">Add the note</button></div>`:''}
    ${M&&(d.waitingFromParent||[]).length?`<h2>Members who have not opened it yet</h2><p class="lede">They are members already, through the conversations this grew from. Send them the link; it opens with their One Button, or their sign-in for that space.</p>
      ${d.waitingFromParent.map(p=>`<div class="box"><b>${esc(p.name)}</b><div class="row"><button data-copylink>Copy the link</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent('The seed space for '+d.name+': '+location.origin+location.pathname+'?s='+encodeURIComponent(SLUG))}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="https://t.me/share/url?url=${encodeURIComponent(location.origin+location.pathname+'?s='+encodeURIComponent(SLUG))}&text=${encodeURIComponent('The seed space for '+d.name)}" target="_blank" rel="noopener">Telegram</a>${navigator.share?`<button data-native="${esc(location.origin+location.pathname+'?s='+encodeURIComponent(SLUG))}" data-title="${esc('The seed space for '+d.name)}">More</button>`:''}</div></div>`).join('')}`:''}
    ${M?`<h2>People asking to join</h2><p class="lede">Any one member's yes lets someone in. You get a link to send them.</p>
      ${(d.requests||[]).map(r=>`<div class="box"><b>${esc(r.name)}</b> <span class="tag">${new Date(r.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span><div style="font-size:15px">${esc(r.why)}</div>${r.contact?`<div class="tag">${esc(r.contact)}</div>`:''}<div class="row"><button data-admit="${esc(r.id)}">Let them in</button></div><div id="ad-${esc(r.id)}"></div></div>`).join('')||'<p class="lede">Nobody waiting.</p>'}
      <div class="box"><b>Invite someone</b><input id="iv-n" placeholder="Their first name"><button id="iv-go">Make their invitation</button><div id="iv-out"></div></div>`
    :`<h2>Join</h2><div class="box"><p style="margin:0 0 8px">Members add notes, bring seeds from their own conversations and link conversations they are having on the same topic. Anyone already in can let you in.</p>
      <input id="rq-n" placeholder="Your first name"><textarea id="rq-w" placeholder="What you are working on that connects"></textarea><input id="rq-c" placeholder="How they can reach you to send the link (optional)"><button id="rq-go">Ask to join</button>
      <p class="tag" style="margin-top:12px">Already a member? <button class="link" id="si">Sign in</button></p><div id="si-box" hidden><input id="si-n" placeholder="Name"><input id="si-c" placeholder="Account code"><button id="si-go">Sign in</button></div></div>`}
    ${pub.length?shareOut(url,d.name+': seeds from many conversations'):''}
    <p class="foot">Shared under <a href="${esc(d.licence.url)}" target="_blank" rel="noopener">${esc(d.licence.name)}</a>: build on any of it, credit the seed space, share alike. Every seed comes from a private conversation and is here because everyone in it said yes. Made with One Button.</p>`;
  map(d,pub);wire(d);
}
function map(d,pub){const svg=$('#map'),W=720,NS='http://www.w3.org/2000/svg',convs=[...new Set(pub.map(s=>s.convTitle).filter(Boolean))],links=d.links;
  const H=Math.max(160,60+Math.max(pub.length,convs.length+links.length)*34);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML='';
  const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
  const sy=i=>40+i*34,cl=[...convs.map(t=>({t,kind:'c'})),...links.map(l=>({t:l.title,kind:'l'}))];
  pub.forEach((s,i)=>{const j=convs.indexOf(s.convTitle);if(j>=0)el('path',{d:`M250,${sy(i)} C360,${sy(i)} 360,${sy(j)} 470,${sy(j)}`,stroke:'#1A1A1A','stroke-opacity':.3,fill:'none'});});
  pub.forEach((s,i)=>{el('rect',{x:10,y:sy(i)-12,width:240,height:24,fill:'#E6FF00',stroke:'#1A1A1A','stroke-width':.8});const t=el('text',{x:18,y:sy(i)+4});t.textContent=s.title.length>34?s.title.slice(0,33)+'…':s.title;});
  cl.forEach((c,j)=>{el('circle',{cx:478,cy:sy(j),r:6,fill:c.kind==='c'?'#1A1A1A':'#FFFFFF',stroke:'#1A1A1A'});const t=el('text',{x:492,y:sy(j)+4});t.textContent=(c.t.length>36?c.t.slice(0,35)+'…':c.t)+(c.kind==='l'?' (linked)':'');});}
let LK_IV='';
function wire(d){
  const re=()=>load();
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on('#pv',()=>{PREVIEW=!PREVIEW;render(d);window.scrollTo(0,0);});
  document.querySelectorAll('[data-bring]').forEach(b=>b.onclick=()=>{b.disabled=true;post('bring',{slug:SLUG,seed:b.dataset.bring}).then(r=>{say(r.now?'In the seed space now.':'Set: it comes here by itself on the last yes.');re();}).catch(e=>{b.disabled=false;say(e.message);});});
  document.querySelectorAll('[data-copylink]').forEach(b=>b.onclick=()=>{const u=location.origin+location.pathname+'?s='+encodeURIComponent(SLUG);try{navigator.clipboard.writeText(u).then(()=>{b.textContent='Copied';},()=>say(u));}catch(e){say(u);}});
  on('#optin',()=>post('optin',{slug:SLUG,show:!d.me.show}).then(re).catch(e=>say(e.message)));
  on('#lk-go',()=>post('link',{slug:SLUG,title:$('#lk-t').value,summary:$('#lk-s').value,iv:LK_IV}).then(()=>{say('Linked.');LK_IV='';re();}).catch(e=>say(e.message)));
  // Browse instead of remembering: the member's own conversations, ranked by how much they share
  // with this seed space (its name, what it is about, its seeds and notes), already linked ones left out.
  if($('#lk-list')&&KEY){const base=API.replace(/\/ss\/$/,'/');
    const topicWords=new Set((d.name+' '+(d.about||'')+' '+(d.words||[]).join(' ')+' '+(d.seeds||[]).map(s=>s.title+' '+(s.about||'')).join(' ')).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w.length>3));
    const linked=new Set((d.links||[]).map(l=>l.iv).filter(Boolean)),linkedT=new Set((d.links||[]).map(l=>l.title));
    const draw=list=>{const q=($('#lk-find').value||'').toLowerCase().trim();
      const shown=list.filter(c=>!q||(c.title+' '+c.summary+' '+(c.people||[]).join(' ')).toLowerCase().includes(q)).slice(0,q?40:12);
      $('#lk-list').innerHTML=shown.length?shown.map((c,i)=>`<div class="box" style="margin:6px 0;padding:10px 12px;cursor:pointer" data-lkpick="${i}"><b>${esc(c.title)}</b> <span class="tag">${esc(c.when)}${(c.people||[]).length?' . with '+esc(c.people.join(', ')):''}${c.score>1&&!q?' . likely fit':''}</span><div style="font-size:14px;color:var(--muted)">${esc(c.summary.slice(0,160))}</div></div>`).join(''):'<p class="tag">No conversation matches that.</p>';
      document.querySelectorAll('[data-lkpick]').forEach(x=>x.onclick=()=>{const c=shown[+x.dataset.lkpick];LK_IV=c.id;$('#lk-t').value=c.title;$('#lk-s').value=c.summary.split(/(?<=[.!?])\s+/).slice(0,2).join(' ');$('#lk-t').scrollIntoView({behavior:'smooth',block:'center'});});};
    fetch(base+'interview/list',{method:'POST',headers:{'Content-Type':'application/json','x-ob-key':KEY},body:'{}'}).then(r=>r.json()).then(r=>{
      const list=(r.interviews||[]).filter(c=>c.status==='done'&&c.title&&!linked.has(c.id)&&!linkedT.has(c.title)).map(c=>{const txt=(c.title+' '+(c.summary||'')+' '+(c.points||[]).join(' ')).toLowerCase();let score=0;topicWords.forEach(w=>{if(txt.includes(w))score++;});
        return {id:c.id,title:c.title,summary:String(c.summary||''),people:c.people||[],created:c.created||0,when:new Date(c.created||0).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),score};})
        .sort((a,b)=>(b.score>1)-(a.score>1)||b.score-a.score||b.created-a.created);
      draw(list);$('#lk-find').oninput=()=>draw(list);}).catch(()=>{$('#lk-list').innerHTML='<p class="tag">Could not load your conversations. Type one below.</p>';});}
  on('#nt-go',()=>post('note',{slug:SLUG,text:$('#nt').value}).then(re).catch(e=>say(e.message)));
  on('#iv-go',()=>post('invite',{slug:SLUG,name:$('#iv-n').value}).then(r=>{$('#iv-out').innerHTML=`<p>Send this to ${esc(r.name)}. It works once: <a href="${esc(r.link)}">${esc(r.link)}</a></p>`;}).catch(e=>say(e.message)));
  on('#rq-go',()=>post('request',{slug:SLUG,name:$('#rq-n').value,why:$('#rq-w').value,contact:$('#rq-c').value}).then(()=>{say('Asked. Any member can let you in and send you a link.');}).catch(e=>say(e.message)));
  on('#si',()=>{$('#si-box').hidden=false;});
  on('#si-go',()=>weave(()=>W.useAccountCode($('#si-n').value.trim().toLowerCase(),$('#si-c').value.trim(),{device:W.describeDevice()}).then(r=>{if(!r||!r.ok)throw new Error((r&&r.reason)||'sign-in failed');return W.login({name:$('#si-n').value.trim().toLowerCase(),requireCommunity:COM});}).then(re).catch(e=>say(e.message))));
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>post('accept',{slug:SLUG,seed:b.dataset.accept}).then(re).catch(e=>say(e.message)));
  document.querySelectorAll('[data-admit]').forEach(b=>b.onclick=()=>post('admit',{slug:SLUG,request:b.dataset.admit}).then(r=>{$('#ad-'+b.dataset.admit).innerHTML=`<p>Send this to ${esc(r.name)}. It works once: <a href="${esc(r.link)}">${esc(r.link)}</a></p>`;b.remove();}).catch(e=>say(e.message)));
  document.querySelectorAll('[data-addnote]').forEach(b=>b.onclick=()=>{const id=b.dataset.addnote,box=$('#nf-'+id);box.innerHTML=`<textarea id="nfx-${esc(id)}" placeholder="What you would add"></textarea><button id="nfg-${esc(id)}">Add</button>`;
    $('#nfg-'+id).onclick=()=>post('note',{slug:SLUG,seed:id,text:$('#nfx-'+id).value}).then(re).catch(e=>say(e.message));});
}
// Weave sign-in, loaded only when needed: an invitation joins, a kept sign-in opens.
function weave(then){if(W)return then();window.WEAVE_NET=WEAVE;const s=document.createElement('script');s.src=WEAVE+'/wallet.js?v=door3';
  s.onload=()=>{W=window.WeaveWallet;then();};s.onerror=()=>say('The sign-in part did not load. Reload the page.');document.head.appendChild(s);}
function join(){weave(()=>W.inviteInfo(INVITE).then(i=>{
  if(!i||!i.found||i.expired||i.spent){say('This invitation has run out or been used. If you joined before, sign in with your account code.');return load();}
  const name=String(i.forName||'').toLowerCase(),label=i.forLabel||name;
  $('#body').innerHTML=`<h1>You are invited</h1><p class="lede">Someone in this seed space has let you in. Joining takes a few seconds and needs no password.</p><button id="jn">Join as ${esc(label)}</button><p class="tag" id="jn-e"></p>`;
  $('#jn').onclick=()=>{$('#jn').disabled=true;$('#jn-e').textContent='Setting up…';
    W.redeemInvite(INVITE,name,label).then(r=>{history.replaceState(null,'',location.pathname+'?s='+encodeURIComponent(SLUG));
      if(r&&r.accountCode){$('#body').innerHTML=`<h1>You are in. Keep this code.</h1><p class="lede">It signs you in here on any other device. It is shown only once.</p><p style="font:600 22px ui-monospace,monospace;word-break:break-all">${esc(r.accountCode)}</p><p class="tag">Your name: ${esc(name)}</p><button id="cd">Open the seed space</button>`;
        $('#cd').onclick=()=>W.login({name,requireCommunity:COM}).then(load);}
      else return W.login({name,requireCommunity:COM}).then(load);})
    .catch(e=>{$('#jn').disabled=false;$('#jn-e').textContent='That did not work: '+((e&&e.message)||e)+'. If you already have a Weave sign-in, sign in with your account code instead.';});};
}).catch(e=>{say(e.message);load();}));}
function load(){return post('get',{slug:SLUG}).then(render).catch(e=>{$('#body').innerHTML='<h1>Not here</h1><p class="lede">'+esc(e.message)+'</p>';});}
if(INVITE)join();
else if(KEY)load();
else weave(()=>W.check(COM).then(r=>load()).catch(()=>load()));
</script>
<script>
/* A way out, always. Inside the app's frame: links to another One Button page stay in the frame
 * (a new window would replace the whole app). Loaded on its own inside the phone app: a Close
 * button pinned to the top corner goes back to the app. */
(function(){
  const inFrame=window.parent!==window,inApp=!!window.OBNative;
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[target="_blank"]');if(!a)return;
    let u;try{u=new URL(a.href,location.href);}catch(_){return;}
    if(u.host===location.host&&(inFrame||inApp)){e.preventDefault();location.href=u.href;}},true);
  if(!inFrame&&inApp){const b=document.createElement('button');b.textContent='Close';b.setAttribute('aria-label','Close and go back to One Button');
    b.style.cssText='position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:999;font:600 15px Inter,sans-serif;background:#1A1A1A;color:#fff;border:0;padding:10px 16px;min-height:44px;cursor:pointer';
    b.onclick=()=>location.replace('/');document.body.appendChild(b);}
})();
</script>
</body>
