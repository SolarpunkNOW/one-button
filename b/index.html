<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Soundbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Mycelial Minimalism, same as One Button: white paper, ink, spark accent, hairlines, square corners. */
  :root{--paper:#FFFFFF;--ink:#1A1A1A;--muted:#555555;--line:rgba(26,26,26,.15);--spark:#E6FF00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Inter",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding-bottom:64px}
  .bar{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 8px}
  .mark{font:700 18px "Inter Tight",sans-serif}
  .mark b{box-shadow:inset 0 -6px 0 var(--spark)}
  .tag{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  blockquote{font:700 clamp(22px,5vw,30px)/1.3 "Inter Tight",sans-serif;margin:22px 0;border-left:4px solid var(--spark);padding-left:16px}
  button{font:600 15px "Inter",sans-serif;background:var(--ink);color:var(--paper);border:0;padding:12px 18px;min-height:48px;cursor:pointer}
  audio{width:100%;margin-top:12px}
  .foot{margin-top:36px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
  a{color:var(--ink)}
</style>
<script src="../skins/skin.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar"><span class="mark">One <b>Button</b></span><span class="tag">Soundbite</span></div>
  <div id="body"><p class="tag">Opening.</p></div>
</div>
<script>
/* A soundbite everyone in a conversation agreed to share: the words and the clip, nothing more. */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API=/^(one-button-jay\.web\.app|localhost|127\.0\.0\.1)$/.test(location.hostname)||/--/.test(location.hostname)?'':'https://one-button-jay.web.app';
const id=new URLSearchParams(location.search).get('id')||'';
const call=(q)=>fetch(API+'/api/bite/get'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
call('').then(r=>r.json().then(d=>r.ok?d:Promise.reject(new Error(d.error||r.status)))).then(b=>{
  document.title='Soundbite: '+(b.convTitle||'a conversation');
  $('#body').innerHTML=`<blockquote>${esc(b.text)}</blockquote><p class="tag">From "${esc(b.convTitle||'a conversation')}" . shared with the agreement of everyone in it</p>
    <button id="play">Listen</button><div id="pl"></div>
    <p class="foot">Shared under <a href="${esc((b.licence||{}).url||'https://creativecommons.org/licenses/by-sa/4.0/')}" target="_blank" rel="noopener">${esc((b.licence||{}).name||'CC BY-SA 4.0')}</a>. The rest of the conversation stays private with the people who had it. Made with One Button.</p>`;
  $('#play').onclick=()=>{$('#play').disabled=true;call('?id='+encodeURIComponent(id)+'&audio=1').then(r=>{if(!r.ok)throw new Error('the clip is not available');return r.blob();})
    .then(bl=>{const a=document.createElement('audio');a.controls=true;a.src=URL.createObjectURL(bl);$('#pl').appendChild(a);a.play().catch(()=>{});$('#play').remove();})
    .catch(e=>{$('#pl').textContent=e.message;});};
}).catch(e=>{$('#body').innerHTML='<p>'+esc(e.message)+'</p>';});
</script>
</body>
</html>
